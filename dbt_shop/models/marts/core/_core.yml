version: 2

models:
  - name: dim_date
    description: Calendar dimension, one row per day.
    columns:
      - name: date_key
        description: YYYYMMDD integer key used by the facts.
        data_tests: [unique, not_null]

  - name: dim_customer
    description: >
      Customer dimension, **SCD Type 2**. One row per version of a customer; a new version starts when
      they move (city/country) or change name/email. Join facts with
      `fact_ts >= valid_from and fact_ts < valid_to`.
    columns:
      - name: customer_sk
        description: Surrogate key of this version (md5 of customer_id + version timestamp).
        data_tests: [unique, not_null]
      - name: customer_id
        description: Natural key from ShopDB.
        data_tests: [not_null]
      - name: valid_from
        description: When this version became true (first version uses 1900-01-01).
      - name: valid_to
        description: When the next version replaced it (9999-12-31 for the current version).
      - name: is_current
        description: True for the customer's latest version.

  - name: dim_product
    description: >
      Product dimension, **SCD Type 2**. A new version starts when price, cost, name, category or
      active flag changes, so you can answer "what did this cost on the day of the order?".
    columns:
      - name: product_sk
        data_tests: [unique, not_null]
      - name: product_id
        data_tests: [not_null]
      - name: category_name
        data_tests: [not_null]
      - name: unit_price
        data_tests: [not_null]

  - name: fct_order_items
    description: >
      **Main fact table** - grain: one order line. Customer and product are joined point-in-time
      (the version valid when the order was placed).
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: order_date_key
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_key}}
      - name: customer_sk
        description: Customer version at order time.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_sk}}
      - name: product_sk
        description: Product version at order time.
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_product'), field: product_sk}}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['pending', 'processing', 'paid', 'shipped', 'delivered', 'cancelled', 'returned']}
      - name: vendor_id
        description: Store that sold and shipped this line (from its shipment).
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_vendor'), field: vendor_id}}
      - name: net_amount
        description: What the customer paid for this line (after discount).
      - name: gross_margin
        description: net_amount minus cost at the product's cost on the order date.

  - name: fct_orders
    description: Grain - one order. Header, rolled-up lines and payment.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_sk
        data_tests: [not_null]
      - name: net_revenue
        description: total_amount for orders that count as revenue (not cancelled/returned), else 0.

  - name: fct_ledger
    description: >
      **Money fact** - grain: one seller-ledger entry. seller_amount is signed from the seller's side;
      platform_revenue is the commission the marketplace kept (positive), net of returns.
    columns:
      - name: entry_id
        data_tests: [unique, not_null]
      - name: vendor_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_vendor'), field: vendor_id}}
      - name: order_id
        data_tests:
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: entry_type
        data_tests:
          - accepted_values:
              arguments: {values: ['sale', 'commission', 'sale_reversal', 'commission_reversal', 'adjustment']}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['pending', 'available', 'paid']}

  - name: dim_vendor
    description: Marketplace stores (current values). is_autopilot = the store accepts and packs by itself.
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]

  - name: dim_rider
    description: Delivery riders (current values).
    columns:
      - name: rider_id
        data_tests: [unique, not_null]

  - name: fct_shipments
    description: >
      **Fulfilment fact** - grain: one parcel (one vendor's part of an order). Has a timestamp for every step
      and the minutes each stage took: confirm, accept, pack, wait for rider, pickup, ride.
    columns:
      - name: shipment_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships: {arguments: {to: ref('fct_orders'), field: order_id}}
      - name: vendor_id
        data_tests:
          - not_null
          - relationships: {arguments: {to: ref('dim_vendor'), field: vendor_id}}
      - name: rider_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_rider'), field: rider_id}}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['pending', 'confirmed', 'packing', 'ready', 'assigned', 'picked_up', 'delivered', 'cancelled', 'returned']}
      - name: minutes_confirm_to_door
        description: Minutes from confirmation to delivery - the customer-facing delivery time.
