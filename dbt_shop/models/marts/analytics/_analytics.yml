version: 2

models:
  - name: mart_daily_sales
    description: Daily scoreboard - orders, revenue, margin, AOV, cancellations, 7-day moving average.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: mart_product_performance
    description: Per product - units, revenue, margin, return rate, rank overall and within category, stock.
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: mart_category_monthly
    description: Revenue per category per month with month-over-month growth and share of month.

  - name: mart_customer_rfm
    description: >
      RFM segmentation. Recency/Frequency/Monetary scored 1-5 by quintile and mapped to segments
      (Champions, Loyal, Potential loyalist, New customer, At risk, Cannot lose them, Hibernating, Needs attention).
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: segment
        data_tests:
          - accepted_values:
              arguments:
                values: ['Champions', 'Loyal', 'Potential loyalist', 'New customer', 'Cannot lose them',
                         'At risk', 'Hibernating', 'Needs attention']

  - name: mart_customer_ltv
    description: Customer lifetime value - historical spend plus a simple 12-month projection.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]

  - name: mart_cohort_retention
    description: Monthly acquisition cohorts and the share of each cohort that ordered in later months.

  - name: mart_vendor_performance
    description: Per store - revenue, margin, parcels, cancel/return rates and fulfilment speed (last 30 days).
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]

  - name: mart_delivery_daily
    description: Per delivery day - parcels delivered, active riders, payouts and average minutes per fulfilment stage.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: mart_platform_revenue_daily
    description: Per delivery day - delivered sales, commission earned (the platform's revenue), take rate, refunds.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: mart_seller_balances
    description: Per seller - gross sales, commission paid, effective rate, and money held / available / paid out.
    columns:
      - name: vendor_id
        data_tests: [unique, not_null]

  - name: mart_revenue_forecast
    description: Last 90 days of actual revenue plus a 30-day forecast (linear trend x weekday seasonality).
