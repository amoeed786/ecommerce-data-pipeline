version: 2

sources:
  - name: silver
    description: Cleaned, deduplicated, quality-checked Parquet files written by transform/silver.py.
    meta:
      # dbt-duckdb reads these Parquet files directly - no loading step needed.
      external_location: "{{ env_var('SHOP_ROOT', '.') }}/data_lake/silver/{name}.parquet"
    tables:
      - name: categories
      - name: customers
        description: Latest version of each customer.
      - name: customers_history
        description: Every captured version of each customer (for SCD2).
      - name: products
      - name: products_history
        description: Every captured version of each product (for SCD2 - price changes).
      - name: inventory
      - name: orders
      - name: order_items
      - name: payments
      - name: vendors
        description: Marketplace stores. is_bot = autopilot (accepts and packs by itself).
      - name: riders
        description: Delivery riders. is_bot = autopilot rider.
      - name: shipments
        description: One parcel per vendor per order, with a timestamp for every fulfilment step.
      - name: users
        description: Login accounts (no password data - excluded at extraction).
      - name: commission_rules
        description: Commission rates (default / per category / per seller).
      - name: payouts
        description: Transfers of seller earnings.
      - name: ledger_entries
        description: Seller ledger - sale (+), commission (-), and their reversals on returns.
