<script>
// ===================================================================== shared UI kit
const NAV = [
  ["Operations", [["orders", "Orders", "inbox"], ["shipments", "Live shipments", "kanban"], ["riders", "Riders", "bike"], ["@live", "Live ops", "activity"]]],
  ["Marketplace", [["vendors", "Vendors", "store"], ["catalog", "Catalog", "boxes"], ["users", "Users", "users"]]],
  ["Money", [["finance", "Finance", "landmark"], ["payouts", "Payouts", "send"]]],
  ["Data", [["pipeline", "Pipeline", "workflow"], ["@analytics", "Analytics", "chart-column"], ["@docs", "API docs", "file-code"]]],
];
const TONE = { pending: "", processing: "blue", confirmed: "blue", packing: "blue", shipped: "purple", ready: "purple", assigned: "purple",
  picked_up: "purple", delivered: "green", paid: "green", completed: "green", success: "green", available: "green", cancelled: "red", failed: "red",
  returned: "amber", refunded: "amber", busy: "purple", offline: "", scheduled: "blue" };
const pill = (s, text) => `<span class="pill ${TONE[s] ?? ""}">${esc(text || label(s))}</span>`;
const PALETTE = ["#5b3df5", "#0e7490", "#b45309", "#be185d", "#15803d", "#1d4ed8", "#7c2d12", "#6d28d9", "#0f766e", "#9f1239"];
const colorFor = (s) => PALETTE[[...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7) % PALETTE.length];
const logoSq = (name) => `<span class="logo-sq" style="background:${colorFor(name)}" aria-hidden="true">${esc(initials(name))}</span>`;
const avatar = (name) => `<span class="avatar" style="background:${colorFor(name + "r")}" aria-hidden="true">${esc(initials(name))}</span>`;
const sw = (attrs, on, lbl) => `<label class="switch"><input type="checkbox" ${attrs} ${on ? "checked" : ""} aria-label="${esc(lbl)}"><span></span></label>`;
const mins = (s) => (s == null ? "–" : s < 60 ? `${Math.round(s)}s` : s < 3600 ? `${Math.round(s / 60)} min` : `${(s / 3600).toFixed(1)} h`);
const PAY_LABEL = { cash_on_delivery: "Cash on delivery", credit_card: "Credit card", debit_card: "Debit card", paypal: "Mobile wallet", bank_transfer: "Bank transfer" };
const DAGSTER = "http://localhost:3000";
// YYYY-MM-DD in local time (the server buckets days with local GETDATE(), not UTC)
const localDay = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

async function act(path, body, msg, method = "POST") {
  try { const r = await api(path, { method, body }); if (msg) toast(msg, "good"); return r || true; } catch (e) { toast(e.message, "error", 6000); return false; }
}
function confirmDlg({ title, body, ok = "Confirm", danger = false, input = null }) {
  return new Promise((resolve) => {
    const d = $("#dlg");
    d.innerHTML = `<form method="dialog"><div class="b"><h2>${esc(title)}</h2><p>${body}</p>
      ${input ? `<input class="input" id="dlg-in" placeholder="${esc(input)}" required minlength="3">` : ""}</div>
      <div class="f"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn ${danger ? "danger solid" : "primary"}" value="ok">${esc(ok)}</button></div></form>`;
    d.onclose = () => resolve(d.returnValue === "ok" ? (input ? $("#dlg-in").value.trim() : true) : false);
    d.returnValue = "";  // the dialog is reused: Esc must never inherit a previous "ok"
    d.showModal(); (input ? $("#dlg-in") : d.querySelector(".btn.primary, .btn.danger"))?.focus();
  });
}
function sparkline(values, { w = 88, h = 32 } = {}) {
  const v = values.map((x) => Number(x) || 0);
  if (v.length < 2) return "";
  const max = Math.max(...v), min = Math.min(...v), span = max - min || 1;
  const pts = v.map((y, i) => [(i / (v.length - 1)) * w, h - 2 - ((y - min) / span) * (h - 4)]);
  const d = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path class="area" d="${d}L${w},${h}L0,${h}Z"/><path class="line" d="${d}"/></svg>`;
}
// KPI card: value, delta vs previous period (goodWhen: "up" | "down"), sparkline
function kpi(lbl, value, cur, prev, series, { goodWhen = "up", sub = "", fmt = (x) => x } = {}) {
  let d = "";
  if (prev != null && cur != null) {
    const ch = prev ? (cur - prev) / Math.abs(prev) : cur ? 1 : 0;
    const dir = Math.abs(ch) < 0.005 ? "flat" : ch > 0 ? "up" : "down";
    const good = dir === "flat" ? "flat" : dir === goodWhen ? "up" : "down";
    d = `<span class="d ${good}">${dir === "flat" ? "" : icon(dir === "up" ? "arrow-up-right" : "arrow-down-right")}${dir === "flat" ? "no change" : `${(Math.abs(ch) * 100).toFixed(1)}%`}</span>`;
  }
  return `<div class="kpi"><div class="l">${lbl}</div><div class="row"><div><div class="v">${value}</div>${d}${sub ? `<div class="s">${sub}</div>` : ""}</div>${sparkline(series || [])}</div></div>`;
}
const skelTable = (rows = 8, cols = 6) => `<div class="card"><div class="dt-bar"><div class="sk" style="width:240px; height:30px"></div></div>
  <table class="dt"><tbody>${Array.from({ length: rows }, () => `<tr>${Array.from({ length: cols }, (_, i) => `<td><div class="sk" style="width:${[40, 120, 80, 60, 70, 90][i % 6]}px"></div></td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
const skelKpis = (n = 5) => `<div class="kpis">${Array.from({ length: n }, () => `<div class="kpi"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%; height:22px; margin-top:10px"></div></div>`).join("")}</div>`;

// ---------------------------------------------------------------- generic data table
// cols: [{ key, label, num, sort (bool|fn), render(row), width }]. Options: search(row)->text, filters: {name, options:[[value,label]], test(row,value), multi},
// select: true, bulk: [[label, icon, fn(rows), danger]], onRow(row), rowId, pageSize, flash(Set), empty
class DataTable {
  constructor(el, opts) { Object.assign(this, { page: 0, q: "", sortKey: null, sortDir: 1, sel: new Set(), pageSize: 25, filterVals: new Set(opts.filterDefault || []) }, opts); this.el = el; }
  setRows(rows) { this.rows = rows; const ids = new Set(rows.map((r) => this.rowId(r))); this.sel.forEach((id) => ids.has(id) || this.sel.delete(id)); this.render(); }
  view() {
    let r = this.rows || [];
    if (this.q && this.search) { const q = this.q.toLowerCase(); r = r.filter((x) => this.search(x).toLowerCase().includes(q)); }
    if (this.filter && this.filterVals.size) r = r.filter((x) => [...this.filterVals].some((v) => this.filter.test(x, v)));
    if (this.sortKey) {
      const c = this.cols.find((c) => c.key === this.sortKey), get = typeof c.sort === "function" ? c.sort : (x) => x[c.key];
      r = [...r].sort((a, b) => { const va = get(a), vb = get(b); return (va == null) - (vb == null) || (va > vb ? 1 : va < vb ? -1 : 0) * this.sortDir; });
    }
    return r;
  }
  render() {
    const all = this.view(), pages = Math.max(1, Math.ceil(all.length / this.pageSize));
    this.page = Math.min(this.page, pages - 1);
    const rows = all.slice(this.page * this.pageSize, (this.page + 1) * this.pageSize);
    const counts = this.counts || (this.filter ? Object.fromEntries(this.filter.options.map(([v]) => [v, (this.rows || []).filter((x) => this.filter.test(x, v)).length])) : {});
    const allSel = rows.length && rows.every((r) => this.sel.has(this.rowId(r)));
    const focus = document.activeElement === this.el.querySelector(".dt-q");
    this.el.innerHTML = `<div class="card">
      <div class="dt-bar">${this.search ? `<div class="dt-search">${icon("search")}<input class="input dt-q" type="search" placeholder="${esc(this.placeholder || "Search…")}" value="${esc(this.q)}" aria-label="Search table"></div>` : ""}
        ${this.filter ? this.filter.options.map(([v, l]) => `<button class="chip ${this.filterVals.has(v) ? "on" : ""}" data-f="${esc(v)}" aria-pressed="${this.filterVals.has(v)}">${esc(l)} <span class="n">${counts[v]}</span></button>`).join("") : ""}
        <span style="margin-left:auto" class="muted">${int(all.length)} ${this.noun || "rows"}</span>${this.toolbar || ""}</div>
      ${this.select ? `<div class="bulk ${this.sel.size ? "on" : ""}"><span>${this.sel.size} selected</span>${(this.bulk || []).map(([l, ic], i) => `<button class="btn sm ${this.bulk[i][3] ? "danger" : ""}" data-bulk="${i}">${icon(ic)}${esc(l)}</button>`).join("")}
        <button class="btn sm ghost" data-bulk="clear">Clear</button></div>` : ""}
      <div class="dt-scroll"><table class="dt"><thead><tr>${this.select ? `<th class="cb"><input type="checkbox" data-all ${allSel ? "checked" : ""} aria-label="Select all on this page"></th>` : ""}
        ${this.cols.map((c) => `<th class="${c.num ? "num" : ""} ${c.sort !== false && c.key ? "sortable" : ""}" ${c.key && c.sort !== false ? `data-sort="${c.key}" aria-sort="${this.sortKey === c.key ? (this.sortDir > 0 ? "ascending" : "descending") : "none"}"` : ""} ${c.width ? `style="width:${c.width}"` : ""}>${esc(c.label)}${this.sortKey === c.key ? icon(this.sortDir > 0 ? "arrow-up" : "arrow-down") : ""}</th>`).join("")}</tr></thead>
        <tbody>${rows.map((r) => { const id = this.rowId(r); return `<tr class="${this.onRow ? "click" : ""} ${this.sel.has(id) ? "sel" : ""} ${this.flash?.has(id) ? "flash" : ""}" data-id="${id}" ${this.onRow ? 'tabindex="0"' : ""}>
          ${this.select ? `<td class="cb"><input type="checkbox" data-cb="${id}" ${this.sel.has(id) ? "checked" : ""} aria-label="Select row"></td>` : ""}
          ${this.cols.map((c) => `<td class="${c.num ? "num" : ""}">${c.render ? c.render(r) : esc(r[c.key] ?? "")}</td>`).join("")}</tr>`; }).join("")}</tbody></table>
        ${rows.length ? "" : `<div class="empty">${icon("inbox")}${esc(this.empty || "Nothing to show")}</div>`}</div>
      ${pages > 1 ? `<div class="dt-foot"><span>Showing ${int(this.page * this.pageSize + 1)}–${int(Math.min(all.length, (this.page + 1) * this.pageSize))} of ${int(all.length)}</span>
        <div class="pg"><button class="btn sm" data-pg="-1" ${this.page ? "" : "disabled"} aria-label="Previous page">${icon("chevron-left")}</button><span>Page ${this.page + 1} / ${pages}</span>
        <button class="btn sm" data-pg="1" ${this.page < pages - 1 ? "" : "disabled"} aria-label="Next page">${icon("chevron-right")}</button></div></div>` : ""}</div>`;
    this.flash?.clear();
    const q = this.el.querySelector(".dt-q");
    if (q) { q.oninput = throttle(() => { this.q = q.value; this.page = 0; this.render(); }, 200); if (focus) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    this.el.querySelectorAll("[data-f]").forEach((b) => (b.onclick = () => {
      const v = b.dataset.f; if (this.filter.multi === false) this.filterVals = new Set(this.filterVals.has(v) ? [] : [v]); else this.filterVals.has(v) ? this.filterVals.delete(v) : this.filterVals.add(v);
      this.page = 0; this.onFilter ? this.onFilter([...this.filterVals]) : this.render(); }));
    this.el.querySelectorAll("[data-sort]").forEach((th) => (th.onclick = () => { const k = th.dataset.sort; this.sortDir = this.sortKey === k ? -this.sortDir : (this.cols.find((c) => c.key === k).num ? -1 : 1); this.sortKey = k; this.render(); }));
    this.el.querySelectorAll("[data-pg]").forEach((b) => (b.onclick = () => { this.page += +b.dataset.pg; this.render(); }));
    this.el.querySelector("[data-all]")?.addEventListener("change", (e) => { rows.forEach((r) => (e.target.checked ? this.sel.add(this.rowId(r)) : this.sel.delete(this.rowId(r)))); this.render(); });
    this.el.querySelectorAll("[data-cb]").forEach((c) => c.addEventListener("change", () => { const id = isNaN(c.dataset.cb) ? c.dataset.cb : +c.dataset.cb; c.checked ? this.sel.add(id) : this.sel.delete(id); this.render(); }));
    this.el.querySelectorAll("[data-bulk]").forEach((b) => (b.onclick = async () => {
      if (b.dataset.bulk === "clear") { this.sel.clear(); return this.render(); }
      const chosen = (this.rows || []).filter((r) => this.sel.has(this.rowId(r)));
      if (await this.bulk[+b.dataset.bulk][2](chosen) !== false) { this.sel.clear(); this.render(); }
    }));
    if (this.onRow) this.el.querySelectorAll("tbody tr[data-id]").forEach((tr) => {
      const open = () => { const id = isNaN(tr.dataset.id) ? tr.dataset.id : +tr.dataset.id; this.onRow((this.rows || []).find((r) => this.rowId(r) === id), tr); };
      tr.onclick = (e) => { if (!e.target.closest("input, button, a, select, label")) open(); };
      tr.onkeydown = (e) => { if ((e.key === "Enter" || e.key === " ") && e.target === tr) { e.preventDefault(); open(); } };  // keyboard users
    });
    this.afterRender?.(this.el);
  }
}

// ---------------------------------------------------------------- drawer
let drawerFor = null, drawerOpener = null;
function openDrawer(html, key) {
  if (!drawerFor) drawerOpener = document.activeElement;   // focus goes back here on close
  drawerFor = key; const d = $("#drawer"); d.innerHTML = html; d.classList.add("on"); d.setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on");
  d.querySelector("[data-close]")?.addEventListener("click", closeDrawer);
  setTimeout(() => d.querySelector("[data-close]")?.focus(), 50);
}
function closeDrawer() {
  const was = drawerFor; drawerFor = null;
  $("#drawer").classList.remove("on"); $("#drawer").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on");
  if (was && drawerOpener && document.contains(drawerOpener)) drawerOpener.focus();
  drawerOpener = null;
}
// keep keyboard focus inside the open drawer (it's modal)
$("#drawer").addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const f = [...$("#drawer").querySelectorAll("button, a[href], select, input, [tabindex]:not([tabindex='-1'])")].filter((x) => !x.disabled && x.offsetParent);
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
});
$("#scrim").onclick = closeDrawer;

// ===================================================================== pages
const view = $("#view");
const PAGES = {};
let current = null, timers = [];
const every = (ms, fn) => timers.push(setInterval(fn, ms));

// ---------------------------------------------------------------- Orders
const ORDER_STATUSES = ["pending", "processing", "shipped", "delivered", "cancelled", "returned"];
const SPEEDS = [0.5, 1, 2, 5, 10, 20];
const orderFlash = new Set();
let ordersTable, orderFilter = ["pending", "processing", "shipped"];
PAGES.orders = {
  title: "Orders",
  async render() {
    view.innerHTML = `<div class="ph"><h1>Orders</h1><span class="sub">Every order in ${esc(BRAND.name)} · updates live</span>
        <div class="actions"><button class="btn primary" id="start-all">${icon("play")}Start all pending</button></div></div>
      <div id="o-kpis">${skelKpis()}</div>
      <div class="card strip" id="o-strip"><div class="sk" style="width:60%"></div></div>
      <div id="o-table">${skelTable()}</div>`;
    ordersTable = new DataTable($("#o-table"), {
      rowId: (o) => o.order_id, noun: "orders", placeholder: "Search order #, customer, city…", select: true, flash: orderFlash, pageSize: 25,
      search: (o) => `${o.order_id} ${o.customer} ${o.email} ${o.shipping_city}`,
      filter: { options: ORDER_STATUSES.map((s) => [s, s]), test: (o, v) => o.status === v }, filterDefault: orderFilter,
      onFilter: (vals) => { orderFilter = vals; loadOrders(); },
      empty: "No orders with these statuses",
      cols: [
        { key: "order_id", label: "Order", num: false, render: (o) => `<b class="mono">#${o.order_id}</b>`, width: "90px" },
        { key: "order_date", label: "Placed", render: (o) => `<span title="${esc(fmtDateTime(o.order_date))}">${ago(o.order_date)}</span>` },
        { key: "customer", label: "Customer", render: (o) => `<div class="cell2">${avatar(o.customer)}<div><div class="t">${esc(o.customer)}</div><div class="m">${esc(o.shipping_city || "")}</div></div></div>` },
        { key: "status", label: "Status", render: (o) => o.awaiting_payment ? pill("pending", "awaiting payment") : pill(o.status) },
        { key: "payment_method", label: "Payment", render: (o) => `<span class="muted">${esc(PAY_LABEL[o.payment_method] || label(o.payment_method))}</span>` },
        { key: "items", label: "Items", num: true }, { key: "shipment_count", label: "Parcels", num: true },
        { key: "total_amount", label: "Total", num: true, render: (o) => `<b>${money(o.total_amount)}</b>` },
        { key: "", label: "", sort: false, render: (o) => o.status === "pending" && !o.awaiting_payment ? `<button class="btn sm primary" data-start="${o.order_id}">${icon("play")}Start</button>` : "" },
      ],
      bulk: [
        ["Start", "play", async (rows) => {
          const ok = rows.filter((o) => o.status === "pending" && !o.awaiting_payment);
          if (!ok.length) { toast("None of the selected orders can be started", "error"); return false; }
          let n = 0; for (const o of ok) if (await act(`/api/admin/orders/${o.order_id}/start`)) n++;
          toast(`Started ${n} order${n === 1 ? "" : "s"}`, "good"); loadOrders(); loadOverview();
        }],
        ["Cancel", "x", async (rows) => {
          const ok = rows.filter((o) => ["pending", "processing"].includes(o.status));
          if (!ok.length) { toast("Only pending or processing orders can be cancelled", "error"); return false; }
          if (!(await confirmDlg({ title: `Cancel ${ok.length} order${ok.length > 1 ? "s" : ""}?`, body: "Stock goes back on sale and online payments are refunded. Parcels a rider already has can't be cancelled.", ok: "Cancel orders", danger: true }))) return false;
          let n = 0; for (const o of ok) { try { await api(`/api/admin/orders/${o.order_id}/cancel`, { method: "POST" }); n++; } catch {} }
          toast(`Cancelled ${n} of ${ok.length}`, n ? "good" : "error"); loadOrders(); loadOverview();
        }, true],
      ],
      onRow: (o) => showOrder(o.order_id),
      afterRender: (el) => el.querySelectorAll("[data-start]").forEach((b) => (b.onclick = async () => {
        b.disabled = true; if (await act(`/api/admin/orders/${b.dataset.start}/start`, null, `Order #${b.dataset.start} sent to the stores`)) { loadOrders(); loadOverview(); } else b.disabled = false; })),
    });
    $("#start-all").onclick = async () => {
      const r = await act("/api/admin/orders/start-all"); if (r) { toast(`Started ${r.started} order${r.started === 1 ? "" : "s"} - they're with the stores now`, "good"); loadOrders(); loadOverview(); }
    };
    await Promise.all([loadKpis(), loadOverview(), loadOrders()]);
    every(4000, loadOverview);
  },
  live(ev) { if (ev.kind === "order" || ev.kind === "shipment") { orderFlash.add(ev.order_id); refreshOrders(); } },
};
async function loadKpis() {
  const k = (await api("/api/admin/kpis?days=28")).days;
  if (!$("#o-kpis")) return;
  const cur = k.slice(-7), prev = k.slice(-14, -7), sum = (a, f) => a.reduce((s, d) => s + (Number(d[f]) || 0), 0);
  const avg = (a, f) => { const v = a.map((d) => d[f]).filter((x) => x != null); return v.length ? v.reduce((s, x) => s + Number(x), 0) / v.length : null; };
  const aov = (a) => (sum(a, "orders") ? sum(a, "gmv") / sum(a, "orders") : 0);
  const cancelRate = (a) => (sum(a, "orders") ? sum(a, "cancelled") / sum(a, "orders") : 0);
  const last14 = k.slice(-14);
  setHTML($("#o-kpis"), `<div class="kpis">
    ${kpi("Orders · 7 days", int(sum(cur, "orders")), sum(cur, "orders"), sum(prev, "orders"), last14.map((d) => d.orders), { sub: "vs previous 7 days" })}

// ---------------------------------------------------------------- Finance
function revenueChart(days) {
  const W = 720, H = 220, P = { l: 56, r: 12, t: 12, b: 26 }, n = days.length;
  const maxG = Math.max(1, ...days.map((d) => d.gmv)), maxC = Math.max(1, ...days.map((d) => d.commission));
  const x = (i) => P.l + (i + .5) * ((W - P.l - P.r) / n), bw = ((W - P.l - P.r) / n) * .62;
  const yG = (v) => H - P.b - (v / maxG) * (H - P.t - P.b), yC = (v) => H - P.b - (v / maxC) * (H - P.t - P.b);
  const ticks = [0, .5, 1].map((f) => maxG * f);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales and commission, last 30 days">
    ${ticks.map((t) => `<line class="grid-l" x1="${P.l}" x2="${W - P.r}" y1="${yG(t)}" y2="${yG(t)}"/><text x="${P.l - 6}" y="${yG(t) + 4}" text-anchor="end">${moneyShort(t).replace("Rs ", "")}</text>`).join("")}
    ${days.map((d, i) => `<rect class="bar" x="${x(i) - bw / 2}" y="${yG(d.gmv)}" width="${bw}" height="${H - P.b - yG(d.gmv)}" rx="2"><title>${d.day}: sales ${money(d.gmv)}, commission ${money(d.commission)}</title></rect>`).join("")}
    <path class="ln" d="${days.map((d, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${yC(d.commission).toFixed(1)}`).join("")}"/>
    ${days.map((d, i) => (i % 5 === 0 || i === n - 1 ? `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${new Date(d.day).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</text>` : "")).join("")}
  </svg><div class="legend"><span><i style="background:color-mix(in srgb, var(--k-brand) 30%, transparent)"></i>Sales (GMV)</span><span><i style="background:var(--k-brand)"></i>Commission (own scale)</span></div>`;
}

        { key: "status", label: "Status", render: (p) => p.status === "paid" ? pill("paid") : pill("scheduled", "to send") },
        { key: "reference", label: "Reference", render: (p) => (p.reference ? `<span class="mono">${esc(p.reference)}</span>` : `<span class="muted">–</span>`) },
        { key: "", label: "", sort: false, render: (p) => p.status === "scheduled" ? `<button class="btn sm primary" data-paid="${p.payout_id}">Mark paid</button>` : "" }],
      afterRender: (el) => el.querySelectorAll("[data-paid]").forEach((b) => (b.onclick = async () => {
        const ref = await confirmDlg({ title: `Mark payout #${b.dataset.paid} paid`, body: "Enter the bank transfer reference.", ok: "Mark paid", input: "Bank reference" });
        if (ref && await act(`/api/admin/payouts/${b.dataset.paid}/paid`, { reference: ref }, "Payout marked paid")) load();
      })),
    });
    const load = async () => {
      const f = await api("/api/admin/finance");
      const sched = f.payouts.filter((p) => p.status === "scheduled");
      setHTML($("#p-kpis"), `<div class="kpis">${kpi("To send", money(sched.reduce((a, p) => a + p.amount, 0)), null, null, [], { sub: `${sched.length} payout(s)` })}
        ${kpi("Ready for the next run", money(f.totals.ready_for_payout), null, null, [], { sub: `minimum ${money(f.min_payout)} per seller` })}
        ${kpi("Paid out · all-time", moneyShort(f.totals.paid_out_all), null, null, [])}</div>`);
      t.setRows(f.payouts);
    };
    await load();
  },
};

// ---------------------------------------------------------------- Pipeline
PAGES.pipeline = {
  title: "Pipeline",
  async render() {
    view.innerHTML = `<div class="ph"><h1>Pipeline</h1><span class="sub">ShopDB → bronze → silver → dbt gold, run automatically by a Dagster sensor</span>
      <div class="actions"><a class="btn" href="${DAGSTER}" target="_blank" rel="noopener">${icon("external-link")}Open Dagster</a><a class="btn" href="${adminBase()}/analytics">${icon("chart-column")}Analytics</a></div></div>
      <div id="pl-kpis">${skelKpis(4)}</div>
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Run history</h2><span class="right muted" style="font-size:12px">bar = duration</span></div><div class="runs" id="pl-runs"><div class="card-b"><div class="sk" style="height:120px"></div></div></div></div>
      <div class="card" style="margin-bottom:16px"><div class="card-h"><h2>Tables in the lake</h2><div class="right"><button class="btn sm" id="lake-refresh">${icon("refresh-cw")}Refresh</button></div></div><div id="pl-lake"><div class="card-b"><div class="sk" style="height:200px"></div></div></div></div>
      <div class="grid g2">
        <div class="card"><div class="card-h"><h2>Shopper simulator</h2><span class="right" id="sim-state"></span></div><div class="card-b">
          <p class="note" style="margin:0 0 12px">${icon("info")}Runs <span class="mono">python source_app/generator.py stream</span>: new customers and orders every few seconds.</p>
          <div style="display:flex; gap:8px; align-items:center"><label>Every <input class="input sm num" id="sim-interval" type="number" min="1" max="60" value="5" style="width:60px"> s</label>
            <button class="btn primary" id="sim-start">${icon("play")}Start</button><button class="btn" id="sim-stop">${icon("square")}Stop</button></div>
          <pre class="out" id="sim-log" style="margin-top:12px">(not running)</pre></div></div>
        <div class="card"><div class="card-h"><h2>Run a step by hand</h2></div><div class="card-b">
          <div style="display:flex; gap:6px; flex-wrap:wrap">${[["extract", "Extract → bronze"], ["silver", "Build silver"], ["dbt_build", "dbt build"], ["export_gold", "Export gold"]].map(([s, l]) => `<button class="btn" data-step="${s}">${esc(l)}</button>`).join("")}</div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px">${[["check_bronze", "Check bronze"], ["check_db", "Check source DB"], ["inject_bad_data", "Inject messy data"]].map(([s, l]) => `<button class="btn ghost" data-step="${s}">${esc(l)}</button>`).join("")}</div>
          <pre class="out" id="step-out" style="margin-top:12px">Pick a step…</pre></div></div>
      </div>`;
    $("#sim-start").onclick = async () => { const s = await act(`/api/admin/simulator/start?interval=${$("#sim-interval").value}`, null, "Simulator started"); if (s) loadSim(s); };
    $("#sim-stop").onclick = async () => { const s = await act("/api/admin/simulator/stop", null, "Simulator stopped"); if (s) loadSim(s); };
    $("#lake-refresh").onclick = () => loadLake(true);
    $$("[data-step]").forEach((b) => (b.onclick = async () => {
      if (b.dataset.step === "inject_bad_data" && !(await confirmDlg({ title: "Inject messy data?", body: "Adds a few deliberately broken rows to ShopDB so you can watch silver quarantine them.", ok: "Inject" }))) return;
      $$("[data-step]").forEach((x) => (x.disabled = true)); $("#step-out").textContent = `Running ${b.textContent}…`;
      try { const r = await api(`/api/admin/pipeline/${b.dataset.step}`, { method: "POST" }); $("#step-out").textContent = `$ ${r.command}\n\n${r.output}\n\n(exit code ${r.exit_code})`;
        toast(r.exit_code === 0 ? `${b.textContent} finished` : `${b.textContent} failed (exit ${r.exit_code})`, r.exit_code === 0 ? "good" : "error"); loadLake(); }
      catch (e) { $("#step-out").textContent = e.message; toast(e.message, "error"); }
      finally { $$("[data-step]").forEach((x) => (x.disabled = false)); }
    }));
    await Promise.all([loadAuto(), loadSim(), loadLake()]);
    every(3000, () => loadSim()); every(10000, () => { loadAuto(); loadLake(); });
  },
};
async function loadAuto() {
  const s = await api("/api/admin/pipeline-status"), runs = s.runs, last = runs[0];
  if (!$("#pl-kpis")) return;
  const maxS = Math.max(1, ...runs.map((r) => r.seconds || 0)), okRuns = runs.filter((r) => r.status === "success");
  setHTML($("#pl-kpis"), `<div class="kpis">
    ${kpi("Automation", s.dagster_up ? pill("success", "running") : pill("failed", "off"), null, null, [], { sub: s.dagster_up ? "sensor checks ShopDB every 30 s" : "start it with python start.py" })}
    ${kpi("Gold refreshed", s.gold_built_at ? ago(s.gold_built_at) : "never", null, null, [], { sub: s.gold_built_at ? fmtDateTime(s.gold_built_at) : "" })}
    ${kpi("Waiting to process", s.pending_tables.length ? `${s.pending_tables.length} tables` : "nothing", null, null, [], { sub: s.pending_tables.length ? `oldest change ${ago(s.oldest_pending_change)}` : "the lake is up to date" })}
    ${kpi("Run time", last ? mins(last.seconds) : "–", null, null, okRuns.slice(0, 20).reverse().map((r) => r.seconds), { sub: `${okRuns.length}/${runs.length} recent runs succeeded` })}</div>`);
  setHTML($("#pl-runs"), runs.map((r) => `<div class="run"><span>${fmtDateTime(r.finished_at)}<div class="muted">${ago(r.finished_at)}</div></span>
    <span>${pill(r.status === "success" ? "success" : "failed", r.status === "success" ? "succeeded" : "failed")}</span>
    <span><div class="dur ${r.status === "success" ? "" : "fail"}" style="width:${Math.max(2, (r.seconds / maxS) * 100)}%"></div><div class="tables" title="${esc(r.changed_tables || "")}">${esc(r.changed_tables || "–")}</div></span>
    <span class="num">${mins(r.seconds)}</span><a class="btn sm ghost" href="${DAGSTER}/runs/${esc(r.run_id)}" target="_blank" rel="noopener">${icon("external-link")}Dagster</a></div>`).join("")
    || `<div class="empty">${icon("workflow")}No automatic runs yet</div>`);
}
async function loadLake(toastIt) {
  const l = await api("/api/admin/lake");
  if (!$("#pl-lake")) return;
  const dq = Object.fromEntries((l.dq_latest || []).map((r) => [r.table, r]));
  const maxRows = Math.max(1, ...l.layers.map((t) => t.silver_rows));
  const kv = (o) => Object.entries(o || {}).map(([k, v]) => `${k}: ${v}`).join(", ");
  setHTML($("#pl-lake"), `<div class="dt-scroll" style="--dt-max:520px"><table class="dt"><thead><tr><th>Table</th><th class="num">Bronze files</th><th class="num">Bronze rows</th><th>Silver rows</th>
    <th class="num">Quarantined</th><th>Data-quality warnings</th><th>Watermark</th></tr></thead><tbody>${l.layers.map((t) => `<tr><td class="mono">${esc(t.table)}</td>
    <td class="num">${t.bronze_files}</td><td class="num">${int(t.bronze_rows)}</td>
    <td><div class="bar-cell"><span class="num" style="min-width:64px">${int(t.silver_rows)}</span><span class="track"><i style="width:${(t.silver_rows / maxRows) * 100}%"></i></span></div></td>
    <td class="num">${t.quarantined ? `<span class="pill red plain">${int(t.quarantined)}</span>` : `<span class="muted">0</span>`}</td>
    <td class="muted" style="max-width:280px; overflow:hidden; text-overflow:ellipsis" title="${esc(kv(dq[t.table]?.warnings))}">${esc(kv(dq[t.table]?.warnings)) || "–"}</td>
    <td class="muted">${fmtDateTime(l.watermarks[t.table])}</td></tr>`).join("")}</tbody></table></div>`);
  if (toastIt) toast("Lake stats refreshed", "good");
}
async function loadSim(s) {
  if (!$("#sim-state")) return;
  s = s || await api("/api/admin/simulator");
  $("#sim-state").innerHTML = s.running ? pill("success", `running every ${s.interval}s`) : pill("pending", "stopped");
  $("#sim-start").disabled = s.running; $("#sim-stop").disabled = !s.running;
  setHTML($("#sim-log"), esc(s.log.join("\n") || "(not running)"));
}

// ===================================================================== shell: nav, router, palette, notifications
function renderNav() {
  $("#sidenav").innerHTML = NAV.map(([g, items], gi) => `${gi ? '<div class="grp-sep"></div>' : ""}<div class="grp">${g}</div>${items.map(([k, l, ic]) => {
    const ext = k === "@docs", href = k === "@live" ? `${adminBase()}/dashboard` : k === "@analytics" ? `${adminBase()}/analytics` : k === "@docs" ? "/docs" : `#/${k}`;
    return `<a class="nav" href="${href}" data-page="${k}" ${k === "@docs" ? 'target="_blank" rel="noopener"' : ""} title="${l}">${icon(ic)}<span class="lbl">${l}</span>${ext ? icon("external-link", "ext") : `<span class="badge-n" id="nb-${k}" hidden></span>`}</a>`;
  }).join("")}`).join("");
}
function setNavBadge(k, n) { const b = $(`#nb-${k}`); if (!b) return; b.hidden = !n; b.textContent = n > 99 ? "99+" : n; }
async function route() {
  const k = (location.hash.match(/^#\/(\w+)/) || [])[1];
  const key = PAGES[k] ? k : "orders";
  if (key === current && location.hash) return;
  timers.forEach(clearInterval); timers = []; ordersTable = null; closeDrawer();
  current = key;
  $$("#sidenav a.nav").forEach((a) => a.classList.toggle("on", a.dataset.page === key));
  $("#crumb").textContent = PAGES[key].title; document.title = `${PAGES[key].title} · Kartora admin`;
  $("#page").scrollTop = 0;
  try { await PAGES[key].render(); } catch (e) { console.error(e.stack || e); view.innerHTML = `<div class="empty">${icon("triangle-alert")}<b>Couldn't load this page</b><br>${esc(e.message)}<br><br><button class="btn" onclick="current=null; route()">Try again</button></div>`; }
}
window.addEventListener("hashchange", route);

// command palette (Ctrl+K)
const COMMANDS = () => [
  ...NAV.flatMap(([g, items]) => items.map(([k, l, ic]) => ({ g: "Go to", l, ic, run: () => (k === "@live" ? (location.href = `${adminBase()}/dashboard`) : k === "@analytics" ? (location.href = `${adminBase()}/analytics`) : k === "@docs" ? open("/docs", "_blank") : (location.hash = `#/${k}`)) }))),
  { g: "Actions", l: "Start all pending orders", ic: "play", run: async () => { const r = await act("/api/admin/orders/start-all"); if (r) toast(`Started ${r.started} orders`, "good"); } },
  { g: "Actions", l: "Run seller payouts…", ic: "send", run: () => { location.hash = "#/finance"; setTimeout(() => $("#run-payouts")?.click(), 600); } },
  { g: "Actions", l: "Toggle dark mode", ic: "moon", run: () => setTheme(effectiveTheme() === "dark" ? "light" : "dark") },
  { g: "Actions", l: "Toggle compact / comfortable rows", ic: "rows-3", run: () => setDensity(document.documentElement.classList.contains("comfortable") ? "compact" : "comfortable") },
  { g: "Actions", l: "Open storefront", ic: "external-link", run: () => open("/", "_blank") },
  { g: "Actions", l: "Sign out", ic: "log-out", run: logout },
];
let cmdSel = 0, cmdItems = [];
function renderCmd() {
  const q = $("#cmdk-q").value.trim().toLowerCase();
  const num = q.replace(/^#/, "");
  cmdItems = [...(/^\d+$/.test(num) ? [{ g: "Orders", l: `Open order #${num}`, ic: "inbox", run: () => { if (current !== "orders") location.hash = "#/orders"; setTimeout(() => showOrder(+num), current === "orders" ? 0 : 400); } }] : []),
    ...COMMANDS().filter((c) => !q || c.l.toLowerCase().includes(q))];
  cmdSel = Math.min(cmdSel, Math.max(0, cmdItems.length - 1));
  let g = null;
  $("#cmdk-list").innerHTML = cmdItems.map((c, i) => `${c.g !== g ? `<div class="hd">${(g = c.g)}</div>` : ""}<div class="it ${i === cmdSel ? "on" : ""}" data-i="${i}" role="option" aria-selected="${i === cmdSel}">${icon(c.ic)}${esc(c.l)}${i === cmdSel ? `<span class="hint">Enter</span>` : ""}</div>`).join("")
    || `<div class="empty">No matches</div>`;
  $$("#cmdk-list .it").forEach((el) => (el.onclick = () => runCmd(+el.dataset.i)));
}
function runCmd(i) { const c = cmdItems[i]; if (!c) return; $("#cmdk").close(); c.run(); }
function openCmd() { $("#cmdk-q").value = ""; cmdSel = 0; renderCmd(); $("#cmdk").showModal(); $("#cmdk-q").focus(); }
$("#cmdk-open").onclick = openCmd;
$("#cmdk-q").oninput = () => { cmdSel = 0; renderCmd(); };
$("#cmdk-q").onkeydown = (e) => {
  if (e.key === "ArrowDown") { cmdSel = Math.min(cmdItems.length - 1, cmdSel + 1); renderCmd(); e.preventDefault(); }
  if (e.key === "ArrowUp") { cmdSel = Math.max(0, cmdSel - 1); renderCmd(); e.preventDefault(); }
  if (e.key === "Enter") { runCmd(cmdSel); e.preventDefault(); }
};
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); $("#cmdk").open ? $("#cmdk").close() : openCmd(); }
  if (e.key === "Escape" && $("#drawer").classList.contains("on") && !$("#dlg").open && !$("#cmdk").open) closeDrawer();
});

// theme + density
const effectiveTheme = () => document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
function setTheme(t) { try { localStorage.setItem("ka.theme", t); } catch {} if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t; renderMe(); }
function setDensity(d) { try { localStorage.setItem("ka.density", d); } catch {} document.documentElement.classList.toggle("comfortable", d === "comfortable"); renderMe(); }
function renderMe() {
  const t = (() => { try { return localStorage.getItem("ka.theme") || "system"; } catch { return "system"; } })();
  const comfy = document.documentElement.classList.contains("comfortable");
  $("#me-pop").innerHTML = `<div class="hd">${esc(ME?.display_name || "Admin")}<div style="text-transform:none; font-weight:400; letter-spacing:0">${esc(ME?.email || "")}</div></div><div class="sep"></div>
    <div style="padding:6px 10px"><div class="muted" style="font-size:11px; margin-bottom:6px">Theme</div><div class="seg">${[["light", "sun", "Light"], ["dark", "moon", "Dark"], ["system", "monitor", "Auto"]].map(([v, ic, l]) => `<button class="${t === v ? "on" : ""}" data-theme-set="${v}">${icon(ic, "xs")}${l}</button>`).join("")}</div></div>
    <div style="padding:6px 10px"><div class="muted" style="font-size:11px; margin-bottom:6px">Density</div><div class="seg"><button class="${comfy ? "" : "on"}" data-density="compact">${icon("rows-4", "xs")}Compact</button><button class="${comfy ? "on" : ""}" data-density="comfortable">${icon("rows-3", "xs")}Comfortable</button></div></div>
    <div class="sep"></div><a class="mi" href="/" target="_blank" rel="noopener">${icon("external-link")}Storefront</a><a class="mi" href="/docs" target="_blank" rel="noopener">${icon("file-code")}API docs</a>
    <button class="mi" id="me-logout">${icon("log-out")}Sign out</button>`;
  $$("[data-theme-set]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); setTheme(b.dataset.themeSet); }));
  $$("[data-density]").forEach((b) => (b.onclick = (e) => { e.stopPropagation(); setDensity(b.dataset.density); }));
  $("#me-logout").onclick = logout;
}
$("#me-btn").onclick = (e) => { e.stopPropagation(); $("#bell-menu").classList.remove("open"); $("#me-menu").classList.toggle("open"); };
$("#bell").onclick = (e) => { e.stopPropagation(); $("#me-menu").classList.remove("open"); $("#bell-menu").classList.toggle("open"); unread = 0; $("#bell-n").hidden = true; renderNotif(); };
document.addEventListener("click", (e) => $$(".menu.open").forEach((m) => !m.contains(e.target) && m.classList.remove("open")));
$("#collapse").onclick = (e) => { e.preventDefault(); const c = $("#app").classList.toggle("collapsed"); try { localStorage.setItem("ka.side", c ? "c" : ""); } catch {} };
try { if (localStorage.getItem("ka.side") === "c") $("#app").classList.add("collapsed"); } catch {}

// notifications: new orders, failed payments, deliveries (from the live feed)
const notes = []; let unread = 0;
function renderNotif() {
  $("#notif").innerHTML = `<div class="hd">Notifications</div>${notes.slice(0, 40).map((n) => `<div class="n">${icon(n.ic, "xs")}<span>${n.html}</span><time>${fmtTime(n.t)}</time></div>`).join("") || `<div class="empty">${icon("bell")}Nothing yet - new orders and deliveries show up here</div>`}`;
}
function notify(ic, html) { notes.unshift({ ic, html, t: new Date().toISOString() }); if (notes.length > 100) notes.pop(); if (!$("#bell-menu").classList.contains("open")) { unread++; $("#bell-n").hidden = false; $("#bell-n").textContent = unread > 9 ? "9+" : unread; } else renderNotif(); }

(async () => {
  $("#logo").innerHTML = LOGO_SVG(26);
  const me = await loadMe();
  if (!me || me.role !== "admin") { location.href = "/"; return; }
  $("#me-av").textContent = initials(me.display_name);
  renderNav(); renderMe(); renderNotif();
  const es = liveEvents((ev) => {
    if (ev.kind === "order" && ev.action === "created") notify("inbox", `New order <b>#${ev.order_id}</b> · ${money(ev.amount)}`);
    if (ev.kind === "shipment" && ev.status === "delivered") notify("house", `Order #${ev.order_id} delivered by ${esc(ev.detail || "rider")}`);
    if (ev.kind === "shipment" && ev.status === "cancelled") notify("x", `Order #${ev.order_id}: parcel cancelled`);
    PAGES[current]?.live?.(ev);
    if ((ev.kind === "order" || ev.kind === "shipment") && drawerFor === `order:${ev.order_id}`) refreshDrawer();
  });
  const dot = $("#livedot");
  es.addEventListener("open", () => { dot.classList.add("on"); dot.querySelector("span").textContent = "Live"; });
  es.addEventListener("error", () => { dot.classList.remove("on"); dot.querySelector("span").textContent = "Reconnecting"; });
  route();
  api("/api/admin/overview").then((o) => setNavBadge("orders", o.pending_orders)).catch(() => {});
})();
</script>
