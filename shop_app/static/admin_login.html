<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin console · Kartora</title>
  <link rel="preload" href="/static/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/ds.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background: var(--bg); }
    .wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .box { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px; }
    .box .brandmark { font-size: 16px; }
    .box h1 { font-size: 20px; margin: 20px 0 4px; }
    .box p { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
    .field input { width: 100%; height: 44px; }
    .box button.primary { width: 100%; height: 44px; margin-top: 4px; }
    .lock { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--st-gray); background: var(--st-gray-bg); border-radius: 10px; padding: 2px 8px; }
    .note { font-size: 12px; color: var(--muted); margin-top: 16px; text-align: center; }
  </style>
</head>
<body>
<div class="wrap">
  <form class="box" id="form" autocomplete="on">
    <span data-brandmark="admin console" data-size="34"></span>
    <h1>Sign in to the control room</h1>
    <p><span class="lock"><svg class="ic sm" aria-hidden="true"><use href="#i-lock"/></svg> restricted</span> &nbsp;For marketplace administrators only.</p>
    <label class="field">Admin email<input name="email" type="email" autocomplete="username" required autofocus></label>
    <label class="field">Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" style="width:100%; padding:12px; font-weight:700">Sign in</button>
    <div class="note">Sessions expire after 7 days · 5 failed attempts lock the account for 5 minutes</div>
  </form>
</div>
<script src="/static/common.js"></script>
<script src="/static/ds.js"></script>
<script>
// This page is served at <ADMIN_PATH>/login, so the admin area's base is our own address minus "/login".
const base = location.pathname.replace(/\/login\/?$/, "");
const next = new URLSearchParams(location.search).get("next");
const target = next && next.startsWith(base) && !next.startsWith("//") ? next : base;
$("#form").onsubmit = async (e) => {
  e.preventDefault();
  const btn = $("button", e.target);
  btn.disabled = true;
  try {
    await api("/api/auth/login", { method: "POST", body: { ...Object.fromEntries(new FormData(e.target)), role: "admin" } });
    location.href = target;
  } catch (err) { toast(err.message, "error", 5000); }
  finally { btn.disabled = false; }
};
loadMe().then((me) => { if (me?.role === "admin") location.href = target; });  // already signed in
</script>
</body>
</html>
