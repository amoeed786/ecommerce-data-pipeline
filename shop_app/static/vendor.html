<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller center · Kartora</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header></header>
<main>
  <div class="row" style="justify-content:space-between; margin-bottom:14px">
    <div><h1 id="store-name">Seller center</h1><div class="muted small" id="store-sub"></div></div>
    <div class="card row" style="padding:10px 14px">
      <label class="switch"><input type="checkbox" id="autopilot"><span></span></label>
      <div><b>Autopilot</b><div class="muted small" id="ap-text"></div></div>
    </div>
  </div>
  <div class="portal-kpis" id="kpis"></div>

  <div class="tabs">
    <button data-tab="orders" class="on">📦 Orders</button>
    <button data-tab="products">🏷️ Products &amp; photos</button>
  </div>

  <section id="tab-orders">
    <div class="stage-tabs" id="stages"></div>
    <div class="bulkbar hidden" id="bulkbar">
      <span class="count" id="sel-count"></span><span class="spacer"></span>
      <button class="primary" data-bulk="accept_ready">⚡ Accept + pack &amp; hand to rider</button>
      <button data-bulk="accept">✔ Accept</button>
      <button data-bulk="ready">📦 Mark packed</button>
      <button id="slips">🖨 Packing slips</button>
      <button id="clear">Clear</button>
    </div>
    <div class="row" style="margin-bottom:10px">
      <label class="row small"><input type="checkbox" id="select-all"> Select all on this tab</label>
      <span class="spacer"></span><span class="muted small" id="tab-hint"></span>
    </div>
    <div id="queue"></div>
  </section>

  <section id="tab-products" class="hidden grid">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Your products</h2><input id="psearch" type="search" placeholder="Filter…"></div>
      <p class="muted small">Click a photo to upload your own (JPG/PNG/WebP, up to 3 MB) - shoppers see it right away.</p>
      <div class="table-wrap"><table>
        <thead><tr><th>Photo</th><th>Product</th><th class="num">Sold</th><th>Price</th><th>Was (sale)</th><th class="num">Stock</th><th>Restock</th><th>Listed</th></tr></thead>
        <tbody id="products"></tbody></table></div>
      <input type="file" id="photo-input" accept="image/jpeg,image/png,image/webp" class="hidden">
    </div>
    <div class="card">
      <h2>Add a product</h2>
      <form id="newp" class="grid" style="grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap:10px; align-items:end">
        <div class="field">Name<input name="product_name" required></div>
        <div class="field">Category<select name="category_id" id="cats"></select></div>
        <div class="field">Price<input name="unit_price" type="number" step="0.01" min="0.01" required></div>
        <div class="field">Cost<input name="unit_cost" type="number" step="0.01" min="0" required></div>
        <div class="field">Stock<input name="stock" type="number" min="0" value="50" required></div>
        <div class="field" style="grid-column: span 4">Description<input name="description"></div>
        <button class="primary">Add product</button>
      </form>
    </div>
  </section>
</main>

<script src="/static/common.js"></script>
<script>
const STAGES = [
  ["new", "🔔 New", ["confirmed"], "Accept to start packing - or accept + pack in one go"],
  ["packing", "📦 Packing", ["packing"], "Mark packed when the parcel is sealed - a rider is assigned automatically"],
  ["pickup", "🛵 Awaiting pickup", ["ready", "assigned"], "Packed. A rider is on the way to collect"],
  ["transit", "🚚 On the way", ["picked_up"], "With the rider, heading to the customer"],
  ["done", "✅ Delivered", ["delivered"], "Recently delivered parcels"],
  ["waiting", "⏳ Awaiting approval", ["pending"], "Placed by customers, waiting for the marketplace to confirm"],
];
let stage = "new", ships = [], products = [], store = null, uploadFor = null;
const selected = new Set();
const fresh = new Set();

$$(".tabs button").forEach((b) => (b.onclick = () => {
  $$(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("#tab-orders").classList.toggle("hidden", b.dataset.tab !== "orders");
  $("#tab-products").classList.toggle("hidden", b.dataset.tab !== "products");
  if (b.dataset.tab === "products") loadProducts();
}));

async function loadSummary() {
  const s = store = await api("/api/vendor/summary");
  $("#store-name").textContent = "🏪 " + s.vendor_name;
  $("#store-sub").innerHTML = `${esc(s.tagline || "")} · ${stars(s.rating)} ${s.rating} · <a href="/#/store/${s.vendor_id}" target="_blank">View your storefront →</a>`;
  $("#autopilot").checked = !!s.is_bot;
  $("#ap-text").textContent = s.is_bot ? `On - orders are accepted and packed for you (~${s.prep_seconds}s)` : "Off - you accept and pack orders yourself";
  const tiles = [["Sales today", money(s.sales_today), `${s.orders_today} orders`], ["Sales · 30 days", money(s.sales_30d), "excluding cancelled & returned"],
    ["To handle now", (s.to_accept || 0) + (s.to_pack || 0), `${s.to_accept} to accept · ${s.to_pack} to pack`],
    ["Catalog", s.products, `${s.low_stock} low on stock`]];
  setHTML($("#kpis"), tiles.map(([l, v, sub]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="small muted">${sub}</div></div>`).join(""));
  const counts = { new: s.to_accept, packing: s.to_pack, pickup: s.awaiting_pickup, transit: s.on_the_way, done: null, waiting: s.awaiting_admin };
  if (setHTML($("#stages"), STAGES.map(([k, t]) => `<button class="${stage === k ? "on" : ""}" data-stage="${k}"><span class="small">${t}</span><b>${counts[k] ?? "·"}</b></button>`).join(""))) {
    $$("#stages button").forEach((b) => (b.onclick = () => {
      stage = b.dataset.stage; selected.clear();
      $$("#stages button").forEach((x) => x.classList.toggle("on", x === b));   // respond instantly…
      setHTML($("#queue"), Array.from({ length: 3 }, () => skeletonBlock(110)).join(""));  // …while the list loads
      loadSummary(); loadQueue();
    }));
  }
}
$("#autopilot").onchange = async (e) => {
  await api("/api/vendor/autopilot", { method: "POST", body: { on: e.target.checked } });
  toast(e.target.checked ? "Autopilot on - new orders are handled for you" : "Autopilot off - you're in control", "good");
  loadSummary();
};

function ageBadge(s) {
  const since = s.confirmed_at || s.created_at;
  const min = (Date.now() - new Date(since)) / 60000;
  const late = ["confirmed", "packing"].includes(s.status) && min > 15;
  return `<span class="age ${late ? "late" : "muted"}">${late ? "⚠ " : ""}waiting ${ago(since).replace(" ago", "")}</span>`;
}

async function loadQueue() {
  const statuses = STAGES.find(([k]) => k === stage)[2];
  ships = await api("/api/vendor/shipments?" + new URLSearchParams(statuses.map((s) => ["status", s])));
  $("#tab-hint").textContent = STAGES.find(([k]) => k === stage)[3];
  const actionable = ["new", "packing"].includes(stage);
  $("#select-all").parentElement.classList.toggle("hidden", !actionable);
  const changed = setHTML($("#queue"), ships.map((s) => `
    <div class="job ocard ${selected.has(s.shipment_id) ? "selected" : ""} ${fresh.has(s.shipment_id) ? "new flash" : ""}" data-id="${s.shipment_id}">
      ${actionable ? `<input type="checkbox" data-sel="${s.shipment_id}" ${selected.has(s.shipment_id) ? "checked" : ""}>` : "<span></span>"}
      <div>
        <div class="row"><b>Order #${s.order_id}</b> <span class="muted small">parcel ${s.shipment_id}</span> ${badge(s.status)} ${ageBadge(s)}</div>
        <div class="muted small" style="margin-top:2px">Ship to ${esc(s.customer_first_name)} · ${esc(s.shipping_city)}, ${esc(s.shipping_country)}${s.rider_name ? ` · 🛵 ${esc(s.rider_name)}` : ""}</div>
        <div class="thumbs">${s.lines.map((l) => `<div class="thumb">${productArt(l, "sm")}<div><b>× ${l.quantity}</b> ${esc(l.product_name)}<div class="muted">${esc(l.sku)}</div></div></div>`).join("")}</div>
      </div>
      <div style="text-align:right; min-width:170px">
        <div style="font-size:18px; font-weight:800">${money(s.amount)}</div>
        <div class="grid" style="gap:6px; margin-top:8px">
          ${s.status === "confirmed" ? `<button class="primary small" data-one="accept_ready" data-id="${s.shipment_id}">⚡ Accept + pack</button>
            <button class="small" data-one="accept" data-id="${s.shipment_id}">✔ Accept only</button>` : ""}
          ${s.status === "packing" ? `<button class="primary small" data-one="ready" data-id="${s.shipment_id}">📦 Mark packed</button>` : ""}
        </div>
      </div>
    </div>`).join("") || `<div class="card muted" style="text-align:center; padding:30px">🎉 Nothing here - you're all caught up.</div>`);
  fresh.clear();
  if (changed) {  // only re-wire controls when the list was actually redrawn
    $$("[data-sel]").forEach((c) => (c.onchange = () => { c.checked ? selected.add(+c.dataset.sel) : selected.delete(+c.dataset.sel); c.closest(".ocard").classList.toggle("selected", c.checked); updateBar(); }));
    $$("[data-one]").forEach((b) => (b.onclick = () => runBulk(b.dataset.one, [+b.dataset.id])));
  }
  $("#select-all").checked = actionable && ships.length > 0 && ships.every((s) => selected.has(s.shipment_id));
  updateBar();
}
function updateBar() {
  for (const id of [...selected]) if (!ships.some((s) => s.shipment_id === id)) selected.delete(id);
  const picked = ships.filter((s) => selected.has(s.shipment_id));
  $("#bulkbar").classList.toggle("hidden", !picked.length);
  $("#sel-count").textContent = `${picked.length} order${picked.length > 1 ? "s" : ""} selected · ${money(picked.reduce((a, s) => a + s.amount, 0))}`;
  const anyNew = picked.some((s) => s.status === "confirmed"), anyPacking = picked.some((s) => s.status === "packing");
  $("[data-bulk=accept]").disabled = !anyNew;
  $("[data-bulk=ready]").disabled = !anyPacking;
  $("[data-bulk=accept_ready]").disabled = !(anyNew || anyPacking);
}
$("#select-all").onchange = (e) => { ships.forEach((s) => (e.target.checked ? selected.add(s.shipment_id) : selected.delete(s.shipment_id))); loadQueue(); };
$("#clear").onclick = () => { selected.clear(); loadQueue(); };
$$("[data-bulk]").forEach((b) => (b.onclick = () => runBulk(b.dataset.bulk, [...selected])));

async function runBulk(action, ids) {
  // Instant feedback: the cards dim right away, then slide out when the server confirms.
  const cards = ids.map((id) => $(`.ocard[data-id="${id}"]`)).filter(Boolean);
  cards.forEach((c) => c.classList.add("working"));
  $$("[data-bulk], [data-one]").forEach((b) => (b.disabled = true));
  try {
    const r = await api("/api/vendor/shipments/bulk", { method: "POST", body: { shipment_ids: ids, action } });
    const verb = { accept: "accepted", ready: "packed - riders are being assigned", accept_ready: "accepted, packed and handed to riders" }[action];
    if (r.done.length) toast(`${r.done.length} order${r.done.length > 1 ? "s" : ""} ${verb}`, "good", 4500);
    if (r.failed.length) toast(`${r.failed.length} couldn't be updated: ${r.failed[0].reason}`, "error", 6000);
    r.done.forEach((id) => { selected.delete(id); $(`.ocard[data-id="${id}"]`)?.classList.add("leaving"); });
    await new Promise((ok) => setTimeout(ok, 260));  // let them slide out before the list redraws
  } catch (e) { toast(e.message, "error"); }
  cards.forEach((c) => c.classList.remove("working"));
  $$("[data-bulk], [data-one]").forEach((b) => (b.disabled = false));
  refresh();
}

$("#slips").onclick = () => {
  const picked = ships.filter((s) => selected.has(s.shipment_id));
  const w = window.open("", "_blank");
  w.document.write(`<!doctype html><title>Packing slips</title><style>
    body{font:13px system-ui,sans-serif;margin:24px;color:#111} .slip{border:2px dashed #999;border-radius:10px;padding:16px;margin-bottom:16px;page-break-inside:avoid}
    h2{margin:0 0 4px} table{width:100%;border-collapse:collapse;margin-top:10px} td,th{border-bottom:1px solid #ddd;padding:6px;text-align:left} .r{text-align:right}</style>
    ${picked.map((s) => `<div class="slip"><h2>${BRAND.name} · Order #${s.order_id}</h2><div>Parcel ${s.shipment_id} · from <b>${esc(store.vendor_name)}</b></div>
      <div>Ship to: <b>${esc(s.customer_first_name)}</b>, ${esc(s.shipping_city)}, ${esc(s.shipping_country)}</div>
      <table><tr><th>SKU</th><th>Item</th><th class="r">Qty</th><th>Packed ☐</th></tr>${s.lines.map((l) => `<tr><td>${esc(l.sku)}</td><td>${esc(l.product_name)}</td><td class="r"><b>${l.quantity}</b></td><td>☐</td></tr>`).join("")}</table></div>`).join("")}
    <script>print()<\/script>`);
  w.document.close();
};

// ---------------- products
async function loadProducts() { products = await api("/api/vendor/products"); renderProducts(); }
function renderProducts() {
  const q = $("#psearch").value.toLowerCase();
  $("#products").innerHTML = products.filter((p) => p.product_name.toLowerCase().includes(q)).map((p) => `<tr>
    <td><button class="small" data-photo="${p.product_id}" title="Upload a photo" style="padding:0; width:56px; border:0; background:none">${productArt(p, "sm")}</button></td>
    <td>${esc(p.product_name)}<div class="muted small">${esc(p.sku)} · ${esc(p.category_name)} · ${stars(p.rating)}</div></td>
    <td class="num">${int(p.sold)}</td>
    <td><div class="row"><input type="number" step="0.01" value="${p.unit_price}" id="pr-${p.product_id}" style="width:90px"><button class="small" data-save="${p.product_id}">Save</button></div></td>
    <td><input type="number" step="0.01" value="${p.list_price || ""}" placeholder="none" id="lp-${p.product_id}" style="width:90px"></td>
    <td class="num ${p.stock < 20 ? "stock-low" : ""}">${int(p.stock)}</td>
    <td><div class="row"><input type="number" min="1" value="50" id="rs-${p.product_id}" style="width:70px"><button class="small" data-restock="${p.product_id}">Add</button></div></td>
    <td><label class="switch"><input type="checkbox" data-active="${p.product_id}" ${p.is_active ? "checked" : ""}><span></span></label></td></tr>`).join("");
  const patch = async (id, body, msg) => {
    try { await api(`/api/vendor/products/${id}`, { method: "PATCH", body }); toast(msg, "good"); loadProducts(); } catch (e) { toast(e.message, "error"); }
  };
  $$("[data-save]").forEach((b) => (b.onclick = () => patch(b.dataset.save, { unit_price: +$(`#pr-${b.dataset.save}`).value, list_price: +$(`#lp-${b.dataset.save}`).value || 0 }, "Price updated")));
  $$("[data-restock]").forEach((b) => (b.onclick = () => patch(b.dataset.restock, { add_stock: +$(`#rs-${b.dataset.restock}`).value }, "Stock added")));
  $$("[data-active]").forEach((c) => (c.onchange = () => patch(c.dataset.active, { is_active: c.checked }, c.checked ? "Listed" : "Hidden from the store")));
  $$("[data-photo]").forEach((b) => (b.onclick = () => { uploadFor = b.dataset.photo; $("#photo-input").click(); }));
}
$("#photo-input").onchange = async (e) => {
  const file = e.target.files[0];
  if (!file || !uploadFor) return;
  const fd = new FormData(); fd.append("file", file);
  const res = await fetch(`/api/vendor/products/${uploadFor}/image`, { method: "POST", body: fd, credentials: "same-origin" });
  const data = await res.json().catch(() => ({}));
  res.ok ? toast("Photo updated - shoppers see it now", "good") : toast(data.detail || "Upload failed", "error");
  e.target.value = ""; loadProducts();
};
$("#psearch").oninput = renderProducts;
$("#newp").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  ["category_id", "unit_price", "unit_cost", "stock"].forEach((k) => (body[k] = +body[k]));
  try { const r = await api("/api/vendor/products", { method: "POST", body }); toast(`Product #${r.product_id} is live - click its photo to add one`, "good"); e.target.reset(); loadProducts(); }
  catch (err) { toast(err.message, "error"); }
};

const refresh = throttle(() => { loadSummary(); loadQueue(); }, 1000);
(async () => {
  await renderPortalHeader("seller center");
  $("#cats").innerHTML = (await api("/api/categories")).map((c) => `<option value="${c.category_id}">${esc(c.category_name)}</option>`).join("");
  setHTML($("#kpis"), Array.from({ length: 4 }, () => skeletonBlock(96)).join(""));      // placeholders until data arrives
  setHTML($("#queue"), Array.from({ length: 3 }, () => skeletonBlock(110)).join(""));
  await Promise.all([loadSummary(), loadQueue()]);                                      // both at once, not one after the other
  liveEvents((ev) => {
    if (ev.kind !== "shipment") return;
    if (ev.status === "confirmed") { fresh.add(ev.id); toast(`🔔 New order #${ev.order_id} - accept it to start packing`, "good", 5000); }
    if (ev.status === "assigned") toast(`🛵 A rider is coming for order #${ev.order_id}`);
    refresh();
  });
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
