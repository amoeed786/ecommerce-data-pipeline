<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seller center · ShopLite</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header></header>
<main>
  <div class="row" style="justify-content:space-between; margin-bottom:12px">
    <div><h1 id="store-name">Seller center</h1><div class="muted small" id="store-sub"></div></div>
    <div class="card row" style="padding:10px 14px">
      <label class="switch"><input type="checkbox" id="autopilot"><span></span></label>
      <div><b>Autopilot</b><div class="muted small" id="ap-text"></div></div>
    </div>
  </div>
  <div class="portal-kpis" id="kpis"></div>

  <div class="tabs">
    <button data-tab="orders" class="on">📦 Orders</button>
    <button data-tab="products">🏷️ Products</button>
  </div>

  <section id="tab-orders">
    <div id="filters" class="chips"></div>
    <div id="queue"></div>
  </section>

  <section id="tab-products" class="hidden grid">
    <div class="card">
      <div class="row" style="justify-content:space-between"><h2>Your products</h2><input id="psearch" type="search" placeholder="Filter…"></div>
      <div class="table-wrap"><table>
        <thead><tr><th>Product</th><th class="num">Sold</th><th>Price</th><th>Was (sale)</th><th class="num">Stock</th><th>Restock</th><th>Listed</th></tr></thead>
        <tbody id="products"></tbody></table></div>
    </div>
    <div class="card">
      <h2>Add a product</h2>
      <form id="newp" class="grid" style="grid-template-columns: 2fr 1fr 1fr 1fr 1fr; gap:10px; align-items:end">
        <div class="field">Name<input name="product_name" required></div>
        <div class="field">Category<select name="category_id" id="cats"></select></div>
        <div class="field">Price<input name="unit_price" type="number" step="0.01" min="0.01" required></div>
        <div class="field">Cost<input name="unit_cost" type="number" step="0.01" min="0" required></div>
        <div class="field">Stock<input name="stock" type="number" min="0" value="50" required></div>
        <div class="field" style="grid-column: span 4">Description<input name="description"></div>
        <button class="primary">Add product</button>
      </form>
    </div>
  </section>
</main>

<script src="/static/common.js"></script>
<script>
const FILTERS = [["new", "New", ["confirmed"]], ["packing", "Packing", ["packing"]], ["pickup", "Awaiting pickup", ["ready", "assigned"]],
                 ["transit", "On the way", ["picked_up"]], ["done", "Delivered", ["delivered"]], ["waiting", "Awaiting admin", ["pending"]]];
let filter = "new";
let products = [];

$$(".tabs button").forEach((b) => (b.onclick = () => {
  $$(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
  $("#tab-orders").classList.toggle("hidden", b.dataset.tab !== "orders");
  $("#tab-products").classList.toggle("hidden", b.dataset.tab !== "products");
  if (b.dataset.tab === "products") loadProducts();
}));

async function loadSummary() {
  const s = await api("/api/vendor/summary");
  $("#store-name").textContent = "🏪 " + s.vendor_name;
  $("#store-sub").innerHTML = `${esc(s.tagline || "")} · ${stars(s.rating)} ${s.rating} · <a href="/#/store/${s.vendor_id}" target="_blank">View your store →</a>`;
  $("#autopilot").checked = !!s.is_bot;
  $("#ap-text").textContent = s.is_bot ? `On - orders are accepted and packed for you (~${s.prep_seconds}s)` : "Off - you accept and pack orders yourself";
  const tiles = [["New orders", s.to_accept, "to accept"], ["Packing", s.to_pack, "mark packed when ready"], ["Awaiting pickup", s.awaiting_pickup, "rider coming"],
    ["On the way", s.on_the_way, "with riders"], ["Sales today", money(s.sales_today), `${s.orders_today} orders`], ["Sales · 30 days", money(s.sales_30d), `${s.products} products · ${s.low_stock} low stock`]];
  $("#kpis").innerHTML = tiles.map(([l, v, sub]) => `<div class="card kpi"><div class="label">${l}</div><div class="value">${v}</div><div class="small muted">${sub}</div></div>`).join("");
  const counts = { new: s.to_accept, packing: s.to_pack, pickup: s.awaiting_pickup, transit: s.on_the_way, waiting: s.awaiting_admin };
  $("#filters").innerHTML = FILTERS.map(([k, t]) => `<span class="chip ${filter === k ? "on" : ""}" data-f="${k}">${t}${counts[k] != null ? ` (${counts[k]})` : ""}</span>`).join("");
  $$("#filters .chip").forEach((c) => (c.onclick = () => { filter = c.dataset.f; loadSummary(); loadQueue(); }));
}
$("#autopilot").onchange = async (e) => {
  await api("/api/vendor/autopilot", { method: "POST", body: { on: e.target.checked } });
  toast(e.target.checked ? "Autopilot on - new orders will be handled for you" : "Autopilot off - you're in control", "good");
  loadSummary();
};

const fresh = new Set();
async function loadQueue() {
  const statuses = FILTERS.find(([k]) => k === filter)[2];
  const ships = await api("/api/vendor/shipments?" + new URLSearchParams(statuses.map((s) => ["status", s])));
  $("#queue").innerHTML = ships.map((s) => `
    <div class="job ${fresh.has(s.shipment_id) ? "new flash" : ""}">
      <div class="row" style="justify-content:space-between">
        <div><b>Order #${s.order_id}</b> <span class="muted small">· parcel ${s.shipment_id} · ${ago(s.confirmed_at || s.created_at)}</span></div>
        <div>${badge(s.status)} <b>${money(s.amount)}</b></div></div>
      <div class="muted small" style="margin:4px 0 8px">For ${esc(s.customer_first_name)} · ${esc(s.shipping_city)}, ${esc(s.shipping_country)}${s.rider_name ? ` · rider ${esc(s.rider_name)}` : ""}</div>
      <table><tbody>${s.lines.map((l) => `<tr><td>${esc(l.product_name)}</td><td class="muted">${esc(l.sku)}</td><td class="num"><b>× ${l.quantity}</b></td></tr>`).join("")}</tbody></table>
      <div class="row" style="margin-top:10px">
        ${s.status === "confirmed" ? `<button class="primary" data-act="accept" data-id="${s.shipment_id}">✔ Accept order</button>` : ""}
        ${s.status === "packing" ? `<button class="primary" data-act="ready" data-id="${s.shipment_id}">📦 Mark packed - ready for pickup</button>` : ""}
        ${s.status === "pending" ? `<span class="muted small">Waiting for the marketplace to confirm this order.</span>` : ""}
        ${["ready", "assigned"].includes(s.status) ? `<span class="muted small">Packed ${ago(s.ready_at)} - a rider will collect it.</span>` : ""}
      </div></div>`).join("") || `<div class="card muted">Nothing here right now.</div>`;
  fresh.clear();
  $$("[data-act]").forEach((b) => (b.onclick = async () => {
    b.disabled = true;
    try { await api(`/api/vendor/shipments/${b.dataset.id}/${b.dataset.act}`, { method: "POST" }); toast(b.dataset.act === "accept" ? "Order accepted - start packing" : "Packed - a rider is being assigned", "good"); }
    catch (e) { toast(e.message, "error"); }
    refresh();
  }));
}

async function loadProducts() {
  products = await api("/api/vendor/products");
  renderProducts();
}
function renderProducts() {
  const q = $("#psearch").value.toLowerCase();
  $("#products").innerHTML = products.filter((p) => p.product_name.toLowerCase().includes(q)).map((p) => `<tr>
    <td><div class="row" style="flex-wrap:nowrap"><div style="width:40px">${productArt(p, "sm")}</div><div>${esc(p.product_name)}<div class="muted small">${esc(p.sku)} · ${esc(p.category_name)}</div></div></div></td>
    <td class="num">${int(p.sold)}</td>
    <td><div class="row"><input type="number" step="0.01" value="${p.unit_price}" id="pr-${p.product_id}" style="width:90px"><button class="small" data-save="${p.product_id}">Save</button></div></td>
    <td><input type="number" step="0.01" value="${p.list_price || ""}" placeholder="none" id="lp-${p.product_id}" style="width:90px"></td>
    <td class="num ${p.stock < 20 ? "stock-low" : ""}">${int(p.stock)}</td>
    <td><div class="row"><input type="number" min="1" value="50" id="rs-${p.product_id}" style="width:70px"><button class="small" data-restock="${p.product_id}">Add</button></div></td>
    <td><label class="switch"><input type="checkbox" data-active="${p.product_id}" ${p.is_active ? "checked" : ""}><span></span></label></td></tr>`).join("");
  const patch = async (id, body, msg) => {
    try { await api(`/api/vendor/products/${id}`, { method: "PATCH", body }); toast(msg, "good"); loadProducts(); } catch (e) { toast(e.message, "error"); }
  };
  $$("[data-save]").forEach((b) => (b.onclick = () => patch(b.dataset.save, { unit_price: +$(`#pr-${b.dataset.save}`).value, list_price: +$(`#lp-${b.dataset.save}`).value || 0 }, "Price updated")));
  $$("[data-restock]").forEach((b) => (b.onclick = () => patch(b.dataset.restock, { add_stock: +$(`#rs-${b.dataset.restock}`).value }, "Stock added")));
  $$("[data-active]").forEach((c) => (c.onchange = () => patch(c.dataset.active, { is_active: c.checked }, c.checked ? "Listed" : "Hidden from the store")));
}
$("#psearch").oninput = renderProducts;
$("#newp").onsubmit = async (e) => {
  e.preventDefault();
  const body = Object.fromEntries(new FormData(e.target));
  ["category_id", "unit_price", "unit_cost", "stock"].forEach((k) => (body[k] = +body[k]));
  try { const r = await api("/api/vendor/products", { method: "POST", body }); toast(`Product #${r.product_id} is live`, "good"); e.target.reset(); loadProducts(); }
  catch (err) { toast(err.message, "error"); }
};

const refresh = throttle(() => { loadSummary(); loadQueue(); }, 1000);
(async () => {
  await renderPortalHeader("seller center");
  $("#cats").innerHTML = (await api("/api/categories")).map((c) => `<option value="${c.category_id}">${esc(c.category_name)}</option>`).join("");
  await loadSummary(); await loadQueue();
  liveEvents((ev) => {
    if (ev.kind !== "shipment") return;
    if (ev.status === "confirmed") { fresh.add(ev.id); toast(`🔔 New order #${ev.order_id} - accept it to start packing`, "good", 5000); }
    if (ev.status === "assigned") toast(`🛵 A rider is coming for order #${ev.order_id}`);
    refresh();
  });
  setInterval(refresh, 30000);
})();
</script>
</body>
</html>
